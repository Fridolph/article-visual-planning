interface:
  display_name: "Article Visual Planning"
  short_description: "Analyze article visuals fast, text-first, before any asset generation"
  default_prompt: "Use $article-visual-planning when the user asks to analyze article visuals, generate article visual suggestions, or recommend blog post illustrations. Default to a fast text-first visual plan with explicit production methods, and do not generate image assets unless the user explicitly asks for svg, png, Mermaid, or another concrete visual file."
policy:
  allow_implicit_invocation: true
